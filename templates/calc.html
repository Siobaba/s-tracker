<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-TRACKER // CALCULATOR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap');
        :root { --bg-deep: #050508; --card-bg: rgba(10, 14, 25, 0.7); --neon-green: #00ff66; --neon-cyan: #00e5ff; --neon-purple: #b000ff; --grad-primary: linear-gradient(135deg, var(--neon-green), var(--neon-cyan)); --text-pure: #ffffff; --text-muted: #8ba3b5; --glow-green: 0 0 10px rgba(0, 255, 102, 0.5), 0 0 20px rgba(0, 255, 102, 0.3); --glow-cyan: 0 0 10px rgba(0, 229, 255, 0.5), 0 0 20px rgba(0, 229, 255, 0.3); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, .nav-item { font-family: 'Rajdhani', sans-serif; }
        input, select { font-family: 'JetBrains Mono', monospace; }
        body { background-color: var(--bg-deep); color: var(--text-pure); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; background-image: radial-gradient(circle at 15% 50%, rgba(0, 229, 255, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(0, 255, 102, 0.08), transparent 25%), linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px); background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px; }
        .navbar { background: rgba(5, 7, 12, 0.85); backdrop-filter: blur(15px); border-top: 2px solid; border-image: var(--grad-primary) 1; display: flex; justify-content: space-around; padding: 15px 10px; position: fixed; bottom: 0; width: 100%; z-index: 100; box-shadow: 0 -10px 30px rgba(0,229,255,0.15); }
        .nav-brand, .nav-profile { display: none; }
        .nav-links { display: flex; justify-content: space-around; width: 100%; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; text-decoration: none; transition: 0.3s; position: relative; }
        .nav-item i { font-size: 22px; }
        .nav-item:hover, .nav-item.active { color: var(--neon-cyan); }
        .nav-item.active i { color: var(--neon-green); transform: translateY(-5px) scale(1.2); filter: drop-shadow(var(--glow-green)); }
        .nav-item.active::after { content: ''; position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); width: 30px; height: 3px; background: var(--neon-cyan); box-shadow: var(--glow-cyan); border-radius: 2px; }
        .mobile-header { display: flex; align-items: center; justify-content: space-between; font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 800; background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 20px; border-bottom: 1px solid rgba(0, 229, 255, 0.2); }
        .content { padding: 0 15px 120px 15px; max-width: 850px; margin: 0 auto; width: 100%; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 25px; margin-bottom: 30px; position: relative; border: 1px solid rgba(0, 229, 255, 0.15); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .balance-title { color: var(--neon-cyan); font-size: 14px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .balance-title::before { content: ''; display: block; width: 8px; height: 8px; background: var(--neon-green); box-shadow: var(--glow-green); border-radius: 50%; }
        .custom-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 10px; }
        .form-group label { font-size: 13px; text-transform: uppercase; color: var(--neon-cyan); font-weight: 700; }
        .form-row { display: flex; gap: 20px; } .form-row .form-group { flex: 1; }
        input, select { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 229, 255, 0.3); padding: 16px; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 700; outline: none; width: 100%; }
        input:focus, select:focus { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0, 255, 102, 0.2); }
        @media (min-width: 900px) {
            body { flex-direction: row; }
            .navbar { flex-direction: column; justify-content: flex-start; gap: 20px; width: 300px; height: 100vh; position: fixed; left: 0; top: 0; border-top: none; border-right: 2px solid rgba(0,229,255,0.2); padding: 50px 25px; background: linear-gradient(180deg, rgba(5,7,12,0.95), rgba(2,3,5,0.98)); z-index: 1000; }
            .nav-brand { display: flex; align-items: center; justify-content: center; margin-bottom: 50px; font-size: 28px; font-weight: 800; background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px; }
            .nav-brand i { color: var(--neon-green); -webkit-text-fill-color: initial; }
            .nav-links { flex-direction: column; gap: 15px; flex: 1; justify-content: flex-start; }
            .nav-item { flex-direction: row; gap: 20px; font-size: 16px; padding: 20px; background: rgba(0,229,255,0.02); border: 1px solid rgba(0,229,255,0.1); border-radius: 8px; }
            .nav-item:hover, .nav-item.active { background: rgba(0,229,255,0.08); border-color: rgba(0,229,255,0.3); transform: translateX(10px); }
            .mobile-header { display: none; }
            .content { margin-left: 300px; padding: 60px 70px; max-width: 1400px; width: calc(100% - 300px); }
        }
        @media (max-width: 768px) {
            body { padding: 5px !important; }
            .content { padding: 5px !important; width: 100% !important; }
            .form-row { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <header class="mobile-header">
        <div><i class="fa-solid fa-calculator"></i> КАЛЬКУЛЯТОР</div>
    </header>

    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-bolt"></i> S-TRACKER
        </div>
        <div class="nav-links">
            <a href="/" class="nav-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Главная</span>
            </a>
            <a href="/goals" class="nav-item">
                <i class="fa-solid fa-bullseye"></i>
                <span>Цели</span>
            </a>
            <a href="/calc" class="nav-item active">
                <i class="fa-solid fa-calculator"></i>
                <span>Комиссия</span>
            </a>
            <a href="/ideas" class="nav-item">
                <i class="fa-solid fa-lightbulb"></i>
                <span>Идеи</span>
            </a>
        </div>
    </nav>

    <main class="content">
        
        <div class="card">
            <div class="balance-title" style="margin-bottom: 20px;">КАЛЬКУЛЯТОР КОМИССИИ</div>
            <div class="custom-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Площадка</label>
                        <select id="preset-platform" onchange="applyPreset()">
                            <option value="custom">Своя комиссия</option>
                            <option value="playerok">Playerok (10%)</option>
                            <option value="fanpay">FanPay (8%)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Сумма сделки (₽)</label>
                        <input type="number" id="calc-amount" placeholder="1000" oninput="runCalc()">
                    </div>
                    <div class="form-group">
                        <label>Комиссия (%)</label>
                        <input type="number" id="calc-fee-rate" placeholder="10" value="10" oninput="runCalc()">
                    </div>
                </div>

                <div style="background: rgba(0,0,0,0.5); padding: 25px; border-radius: 8px; border: 1px solid rgba(0,229,255,0.2); display: flex; justify-content: space-around; text-align: center; margin-top: 15px;">
                    <div>
                        <div style="font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Комиссия площадки</div>
                        <div id="res-fee" style="font-size: 24px; font-weight: 700; color: #ff0055; font-family: monospace; margin-top: 5px;">0.00 ₽</div>
                    </div>
                    <div>
                        <div style="font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Чистый доход</div>
                        <div id="res-net" style="font-size: 24px; font-weight: 700; color: var(--neon-green); font-family: monospace; margin-top: 5px;">0.00 ₽</div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        function applyPreset() {
            const platform = document.getElementById('preset-platform').value;
            const feeInput = document.getElementById('calc-fee-rate');
            if (platform === 'playerok') feeInput.value = 10;
            else if (platform === 'fanpay') feeInput.value = 8;
            runCalc();
        }

        function runCalc() {
            const amount = parseFloat(document.getElementById('calc-amount').value) || 0;
            const feeRate = parseFloat(document.getElementById('calc-fee-rate').value) || 0;
            const feeVal = (amount * feeRate) / 100;
            const netVal = amount - feeVal;
            document.getElementById('res-fee').innerText = feeVal.toFixed(2) + ' ₽';
            document.getElementById('res-net').innerText = netVal.toFixed(2) + ' ₽';
        }
    </script>
</body>
</html>
