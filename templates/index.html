<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-TRACKER</title>
    <style>
        :root {
            --bg-color: #050a0f;
            --card-bg: #0d1622;
            --accent-green: #00ff88;
            --accent-cyan: #00f3ff;
            --text-main: #ffffff;
            --text-muted: #6b7d90;
            --border-color: #162638;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            color: var(--accent-green);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .balance-label {
            color: var(--accent-cyan);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 38px;
            font-weight: 900;
            color: var(--accent-green);
            font-family: 'Courier New', monospace;
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            background: #03060a;
            border: 1px solid #1a2e45;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-cyan);
        }

        button {
            width: 100%;
            background: var(--accent-green);
            color: #050a0f;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            box-shadow: 0 0 12px var(--accent-green);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 10px 6px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">⚡ S-TRACKER</div>
        </div>

        <div class="card">
            <div class="balance-label">● Баланс</div>
            <div class="balance-amount">{{ "%.2f"|format(total_balance) }} ₽</div>
        </div>

        <div class="card">
            <div class="card-title">Новая операция</div>
            <form method="POST" action="/add">
                <input type="text" name="title" placeholder="Название" required>
                <input type="number" step="0.01" name="amount" placeholder="Сумма" required>
                <select name="category">
                    <option value="Доход">Доход (+)</option>
                    <option value="Расход">Расход (-)</option>
                </select>
                <button type="submit">Добавить запись</button>
            </form>
        </div>

        <div class="card">
            <div class="card-title">История операций</div>
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Название</th>
                        <th>Сумма</th>
                    </tr>
                </thead>
                <tbody>
                    {% for tx in transactions %}
                    <tr>
                        <td style="color: var(--text-muted); font-size: 11px;">{{ tx.date }}</td>
                        <td>{{ tx.title }}</td>
                        <td style="font-weight: 700; font-family: monospace; color: {{ 'var(--accent-green)' if tx.category == 'Доход' else '#ff4d4d' }};">
                            {{ "+" if tx.category == 'Доход' else "-" }}{{ "%.2f"|format(tx.amount) }} ₽
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-muted); padding: 15px;">
                            Записей пока нет
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
